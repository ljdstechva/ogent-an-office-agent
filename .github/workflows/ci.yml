name: Ogent CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ogent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python 3.14
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ogent-lite/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ogent-lite/web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ogent-lite\requirements.txt
          python -m pip install coverage==7.15.2 pytest==9.0.3 ruff==0.15.17

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ogent-lite\web

      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: ogent-lite\web

      - name: Run unit and regression tests
        run: python -m coverage run --branch --source=ogent_app -m pytest -q
        working-directory: ogent-lite

      - name: Report coverage
        run: python -m coverage report --fail-under=68
        working-directory: ogent-lite

      - name: Compile Python modules
        run: python -m compileall -q ogent-lite

      - name: Run Ruff
        run: |
          python -m ruff check ogent_app tests
          python -m ruff format --check ogent_app tests
          python -m ruff check ogent_app --select C901 --config "lint.mccabe.max-complexity=15"
        working-directory: ogent-lite

      - name: Run Python type checking
        run: npm run typecheck:python
        working-directory: ogent-lite\web

      - name: Test and build frontend
        run: |
          npm run typecheck
          npm test -- --run
          npm run build
          npm run test:e2e
        working-directory: ogent-lite\web

      - name: Check whitespace
        run: git diff --check
