name: Ogent CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ogent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python 3.14
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ogent-lite/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ogent-lite\requirements.txt
          python -m pip install ruff

      - name: Run unit and regression tests
        run: python -m unittest discover -s ogent-lite\tests -v

      - name: Compile Python modules
        run: >-
          python -m py_compile
          ogent-lite\ogent.py
          ogent-lite\ogent_agent_catalog.py
          ogent-lite\ogent_agent_providers.py
          ogent-lite\ogent_references.py

      - name: Run Ruff
        run: >-
          python -m ruff check
          ogent-lite\ogent.py
          ogent-lite\ogent_agent_catalog.py
          ogent-lite\ogent_agent_providers.py
          ogent-lite\ogent_references.py
          ogent-lite\tests

      - name: Check whitespace
        run: git diff --check
